name: PoseArt research evidence gate

on:
  pull_request:
    paths:
      - "js/**"
      - "scripts/**"
      - "docs/pose-research/**"
      - ".github/workflows/pose-research-ci.yml"
  push:
    branches:
      - "research/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-inventory:
    name: 745-pose inventory and reference search gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full refs for production diff check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate all 745 evidence query records
        run: node scripts/phase3-evidence-gate.js
      - name: Verify count, provenance, collisions, and block-by-default policy
        run: node scripts/test-phase3-evidence-gate.js
      - name: Block production geometry edits without independently adjudicated photos
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --no-tags
          BASE="$(git merge-base origin/master HEAD)"
          if git diff --name-only "$BASE" HEAD | grep -E '^(js/poses-data\.js|js/pose-skeleton-3d\.js|js/solarize/)'; then
            echo "::error::Production pose/rig edits require signed photo/geometry evidence."
            node scripts/phase3-evidence-gate.js --require-production-evidence
          else
            echo "PASS: research-only changes; production geometry unchanged."
          fi
      - name: Publish reproducible query plan, never private guide photographs
        uses: actions/upload-artifact@v4
        with:
          name: poseart-phase3-search-plan
          path: artifacts/research/phase3-search-plan.json
          if-no-files-found: error
          retention-days: 14